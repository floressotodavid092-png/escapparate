<!DOCTYPE html>
   <html lang="es">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS ===============-->
      <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/css/styles.css">

      <title>Formulario de inicio de sesion animado - Bedimcode</title>
   </head>
   <body>
      <div class="login">
         <img src="assets/img/login-bg.png" alt="imagen de inicio de sesion" class="login__img">

         <!--=============== FORMULARIO: INICIAR SESION ===============-->
         <form action="" class="login__form login__form--active" id="login-form" data-form="login">
            <h1 class="login__title">Iniciar sesión</h1>

            <div class="login__content">
               <div class="login__box">
                  <i class="ri-user-3-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="email" required class="login__input" id="login-email" placeholder=" ">
                     <label for="login-email" class="login__label">Correo electrónico</label>
                  </div>
               </div>

               <div class="login__box">
                  <i class="ri-lock-2-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="password" required class="login__input" id="login-pass" placeholder=" ">
                     <label for="login-pass" class="login__label">Contraseña</label>
                     <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                  </div>
               </div>
            </div>

            <div class="login__check">
               <div class="login__check-group">
                  <input type="checkbox" class="login__check-input" id="login-check">
                  <label for="login-check" class="login__check-label">Recordarme</label>
               </div>

               <a href="#" class="login__forgot">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login__button">Iniciar sesión</button>

            <p class="login__register">
               ¿No tienes una cuenta? <a href="#" id="show-register">Regístrate</a>
            </p>
         </form>

         <!--=============== FORMULARIO: REGISTRO ===============-->
         <form action="" class="login__form" id="register-form" data-form="register" hidden>
            <h1 class="login__title">Crear cuenta</h1>

            <div class="login__content">
               <div class="login__box">
                  <i class="ri-id-card-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="text" required class="login__input" id="register-name" placeholder=" ">
                     <label for="register-name" class="login__label">Nombre completo</label>
                  </div>
               </div>

               <div class="login__box">
                  <i class="ri-user-3-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="email" required class="login__input" id="register-email" placeholder=" ">
                     <label for="register-email" class="login__label">Correo electrónico</label>
                  </div>
               </div>

               <div class="login__box">
                  <i class="ri-lock-2-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="password" required minlength="6" class="login__input" id="register-pass" placeholder=" ">
                     <label for="register-pass" class="login__label">Contraseña</label>
                     <i class="ri-eye-off-line login__eye" id="register-eye"></i>
                  </div>
               </div>

               <div class="login__box">
                  <i class="ri-briefcase-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="text" required class="login__input" id="register-employee-number" placeholder=" ">
                     <label for="register-employee-number" class="login__label">Número de empleado</label>
                  </div>
               </div>
            </div>

            <button type="submit" class="login__button">Registrarme</button>

            <p class="login__register">
               ¿Ya tienes una cuenta? <a href="#" id="show-login">Inicia sesión</a>
            </p>
         </form>

         <!--=============== MENSAJE: CUENTA CREADA ===============-->
         <div class="login__overlay" id="success-overlay" hidden>
            <div class="login__message">
               <i class="ri-checkbox-circle-line login__message-icon"></i>
               <p class="login__message-text">Tu cuenta se ha creado correctamente</p>
               <button type="button" class="login__button" id="success-accept">Aceptar</button>
            </div>
         </div>

         <!--=============== BIENVENIDA (SESIÓN INICIADA) ===============-->
         <div class="login__overlay" id="welcome-screen" hidden>
            <div class="login__message">
               <i class="ri-user-smile-line login__message-icon"></i>
               <p class="login__message-text" id="welcome-text">Bienvenido</p>
               <button type="button" class="login__button" id="logout-btn">Cerrar sesión</button>
            </div>
         </div>
      </div>

      <!--=============== MAIN JS ===============-->
      <script type="module" src="assets/js/main.js"></script>
   </body>
</html>
